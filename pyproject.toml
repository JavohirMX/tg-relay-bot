[project]
name = "telegram-relay-bot"
version = "0.1.0"
description = "A private Telegram relay inbox bot built with aiogram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram",
    "aiosqlite",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
relay-bot = "relay_bot.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay_bot = ["db/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
